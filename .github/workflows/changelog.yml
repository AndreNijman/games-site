name: changelog

# Keeps /updates current: every half hour, scripts/changelog.mjs looks for new
# GitHub Pages deploys of every game (src/data/games.ts, `repo`), has Claude
# Haiku write each one's summary, and commits src/data/changelog.json to main.
# A push made with the workflow's own token starts no other workflow, so it
# then starts site.yml itself, which tests, builds and deploys the hub.
#
# Secrets:
#   CHANGELOG_TOKEN    fine-grained PAT, read-only Contents, Deployments and
#                      Metadata on every game repository (the private ones too)
#   ANTHROPIC_API_KEY  writes the summaries; without it updates are recorded
#                      and summarised on a later run that has it

on:
  workflow_dispatch:
  # GitHub pauses schedules after 60 days without repository activity; the
  # commits this makes count as activity once a game deploys.
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Record new deploys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # exits non-zero when a repository could not be read, after saving the
      # others, so the commit below still runs and the failure still shows
      - name: Fetch and summarise
        id: sync
        run: node scripts/changelog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and deploy
        if: ${{ !cancelled() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/changelog.json; then
            echo "No new updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/changelog.json
          git commit -m "chore(changelog): record new deploys"
          pushed=
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
          done
          [ -n "$pushed" ] || { echo "Could not push the changelog."; exit 1; }
          gh workflow run site.yml --ref main
